<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121923">
  <title>SiteWork Light · Hold-point signal</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/sitework.css">
  <script type="module" src="/static/light.mjs"></script>
</head>
<body class="light-page off">
<div class="mock-banner" id="mock" role="alert" hidden>MOCK GATE · Test environment. No live release.</div>
<header class="light-topbar">
  <a class="brand" href="/" aria-label="Back to SiteWork"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18M3 5v7m18 0v7" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></span><span class="brand-name">SiteWork.</span></a>
  <button class="btn btn-sm" id="fullscreen" aria-pressed="false"><span class="icon-sm" data-icon="fullscreen"></span><span id="fullscreenLabel">Full screen</span></button>
</header>
<main class="light-content" aria-live="polite" aria-atomic="true">
  <div class="signal-ring" id="signalIcon"><span data-icon="lock"></span></div>
  <div class="eyebrow" id="signalKicker">Hold-point signal</div>
  <h1 class="light-label" id="label">NO INSPECTION</h1>
  <p class="light-sub" id="sub">Waiting for an inspection from the workspace.</p>
</main>
<footer class="light-footer">
  <span class="connection" id="connection" data-status="connecting"><span class="dot"></span><span class="connection-label" id="connectionLabel">Connecting to the workspace</span></span>
  <span id="updated">Live hold-point status</span>
  <a href="/" style="color:inherit">Back to workspace</a>
</footer>
</body>
</html>
