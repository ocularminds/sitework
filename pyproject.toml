[project]
name = "sitework"
version = "0.1.0"
description = "Physical AI hold-point inspection gated by Decionis, grounded by Tavily, perceived with NVIDIA models on Nebius."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.40",
    "tavily-python>=0.5",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*.py"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
